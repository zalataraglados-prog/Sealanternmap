# If empty, plugin uses <server-root>/<world-name>
world-path: ""
world-name: "world"

# HTTP preview endpoint
bind-host: "127.0.0.1"
bind-port: 8156

# Output image location inside plugin data folder
output-dir: "maps"
output-file: "overview.png"

# Render detail edge per chunk:
# 1  = 1 pixel/chunk
# 2  = 4 pixels/chunk (2x2)
# 3  = 9 pixels/chunk (3x3)
# 16 = 1 pixel/block (16x16), best for large building roofs but heaviest
# 80 = 25 pixels/block (80x80 per chunk, 5x5 per block), inspection mode
chunk-pixel-size: 1

# Colors for empty/existing chunks
empty-color: "#111827"
land-color: "#6EE7B7"

visual:
  unknown-fog:
    # true: chunks not persisted in region files are fully covered by empty-color
    # false: unknown area uses disabled-color
    enabled: true
    disabled-color: "#dbeafe"

  chunk-boundary:
    # Show per-chunk border overlay.
    # Best visible when chunk-pixel-size >= 2.
    enabled: false
    # Vivid cyan works better with overlay blending on most terrain tones.
    color: "#00e5ff"

  texture-color:
    # true: try reading vanilla texture colors from Minecraft client jar.
    # false: use built-in legacy color heuristics only.
    enabled: true
    # Optional explicit client jar path (project-local or absolute path both work), example:
    # ./minecraft-jars/1.21.4.jar
    minecraft-jar: ""

local-render:
  # Full render once at startup
  render-on-startup: true
  
  # Startup baseline window edge in chunks.
  # 128 chunks = 2048 blocks.
  startup-window-chunks: 128
  
  startup-predictive:
    # true: first frame predicts terrain from world seed+generator params (biome based),
    # then overlays generated chunks from save data.
    enabled: true

  # Interval task only consumes changed region files from watcher queue
  auto-update:
    enabled: true
    interval-seconds: 30

  # Watch world/region directory and enqueue changed .mca files
  watch-region-directory: true

  # Run forced full render in budget mode to avoid long single-tick stalls.
  full-render-budget:
    enabled: true
    # Per tick chunk draw budget for full-render session.
    max-chunks-per-tick: 64
    # Hard time budget per tick (ms) for full-render session.
    max-millis-per-tick: 12
